[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-correction-loop"
version = "0.1.0"
description = "Domain-neutral critic-driven correction loop for large JSON state, with surgical RFC 6902 patching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rick Choi", email = "rick@caveduck.io" },
]
keywords = ["llm", "json", "rfc6902", "json-patch", "critic-loop", "self-refine", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/warpspaceinc/json-correction-loop"
Repository = "https://github.com/warpspaceinc/json-correction-loop"
Issues = "https://github.com/warpspaceinc/json-correction-loop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/json_correction_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
