[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-correction-loop"
version = "0.1.0"
description = "Critic-driven correction loop for large LLM-generated JSON state. Surgical RFC 6902 patching with sub-agents (path_finder + context narrowing). Works with OpenAI, Anthropic, OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rick Choi", email = "rick@caveduck.io" },
]
keywords = [
  "llm", "agent", "agents", "ai-agents", "llm-agent", "llm-tools",
  "json", "json-patch", "rfc6902", "json-pointer", "rfc6901",
  "critic-loop", "self-refine", "iterative-refinement",
  "tool-calling", "structured-output", "structured-generation",
  "openai", "anthropic", "openrouter",
  "knowledge-graph", "kg-correction",
  "pydantic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/warpspaceinc/json-correction-loop"
Repository = "https://github.com/warpspaceinc/json-correction-loop"
Issues = "https://github.com/warpspaceinc/json-correction-loop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/json_correction_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
